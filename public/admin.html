<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Crawler</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #1a73e8; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 20px; }
    #startBtn { padding: 8px 18px; background: #fff; color: #1a73e8; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
    #startBtn:disabled { background: #ccc; color: #666; cursor: not-allowed; }
    #stopBtn { padding: 8px 18px; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.6); border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; margin-left: 8px; }
    #stopBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #crawlerStatus { font-size: 13px; margin-left: 12px; color: #e8f0fe; }
    #crawlerStats { font-size: 12px; color: #b3d1ff; margin-left: 12px; }
    #cleanupBtn { padding: 8px 16px; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; font-size: 13px; cursor: pointer; margin-left: 10px; }
    #cleanupBtn:hover { background: rgba(255,255,255,0.25); }
    #cleanupBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #crawlResult { font-size: 13px; margin-left: 12px; color: #e8f0fe; }
    .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; padding: 0 24px; overflow-x: auto; }
    .tab { padding: 12px 20px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: bold; color: #555; white-space: nowrap; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
    .panel { display: none; padding: 24px; }
    .panel.active { display: block; }
    table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-size: 13px; color: #555; border-bottom: 1px solid #ddd; }
    td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-free { background: #fce8e6; color: #c62828; }
    .badge-active { background: #e6f4ea; color: #1e7e34; }
    .badge-pending { background: #fff3e0; color: #e65100; }
    .badge-verified { background: #e6f4ea; color: #1e7e34; }
    .badge-rejected { background: #fce8e6; color: #c62828; }
    .badge-matched { background: #e8f0fe; color: #1a73e8; }
    .badge-assigned { background: #e6f4ea; color: #1e7e34; }
    .badge-unmatched { background: #f3e8fd; color: #6a1b9a; }
    button.action { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
    .btn-edit { background: #e8f0fe; color: #1a73e8; }
    .btn-sub-start { background: #e6f4ea; color: #1e7e34; }
    .btn-sub-stop  { background: #fff3e0; color: #e65100; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 8px; padding: 28px 32px; width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 24px rgba(0,0,0,.2); }
    .modal-box h3 { margin: 0 0 20px; font-size: 17px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-grid .full { grid-column: 1/-1; }
    .modal-grid label { display: flex; flex-direction: column; font-size: 12px; color: #555; gap: 4px; }
    .modal-grid input, .modal-grid textarea { padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; font-family: inherit; }
    .modal-grid textarea { resize: vertical; min-height: 60px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-save { padding: 8px 20px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; }
    .btn-cancel { padding: 8px 16px; background: #f1f3f4; color: #444; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
    .btn-verify { background: #e6f4ea; color: #1e7e34; }
    .btn-reject { background: #fce8e6; color: #c62828; }
    .btn-toggle-on { background: #fce8e6; color: #c62828; }
    .btn-toggle-off { background: #e6f4ea; color: #1e7e34; }
    .btn-send { background: #e8f0fe; color: #1a73e8; }
    select.assign { padding: 4px 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .ms-wrap { position: relative; min-width: 200px; }
    .ms-trigger { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: #fff; display: flex; justify-content: space-between; align-items: center; font-size: 12px; user-select: none; white-space: nowrap; }
    .ms-trigger:hover { border-color: #1a73e8; }
    .ms-trigger.open { border-color: #1a73e8; box-shadow: 0 0 0 2px #d2e3fc; }
    .ms-arrow { font-size: 10px; color: #888; margin-left: 6px; }
    .ms-drop { display: none; position: absolute; top: calc(100% + 3px); left: 0; z-index: 200; background: #fff; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); min-width: 240px; }
    .ms-drop.open { display: block; }
    .ms-search { width: 100%; padding: 8px 10px; border: none; border-bottom: 1px solid #eee; font-size: 12px; outline: none; border-radius: 6px 6px 0 0; box-sizing: border-box; }
    .ms-list { max-height: 200px; overflow-y: auto; padding: 4px 0; }
    .ms-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .ms-item:hover { background: #f0f4ff; }
    .ms-item input { cursor: pointer; }
    .ms-item .ms-loc { color: #888; font-size: 11px; }
    .reply-cell { max-width: 200px; font-size: 12px; color: #555; white-space: pre-wrap; word-break: break-word; }
    .filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar input[type=text], .filter-bar input[type=search] {
      padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; min-width: 220px;
    }
    .filter-bar input[type=date] { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    .filter-bar label { font-size: 13px; color: #555; }
    .filter-bar button { padding: 7px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .btn-apply { background: #1a73e8; color: #fff; }
    .btn-clear { background: #f1f3f4; color: #444; }
    .count-badge { font-size: 12px; color: #888; margin-left: 8px; }
    .source-ig { color: #c13584; font-size: 12px; }
    .source-im { color: #e65c00; font-size: 12px; }
    .source-reddit { color: #ff4500; font-size: 12px; }
    #log-box { background: #1e1e1e; border-radius: 6px; padding: 12px 16px; height: 520px; overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6; }
    .log-line { display: flex; gap: 10px; border-bottom: 1px solid #2a2a2a; padding: 2px 0; }
    .log-time { color: #888; flex-shrink: 0; }
    .log-info .log-msg { color: #d4d4d4; }
    .log-warn .log-msg { color: #f0c674; }
    .log-error .log-msg { color: #ff6b6b; }
    .log-level { width: 36px; flex-shrink: 0; font-weight: bold; }
    .log-info .log-level { color: #6ab4f5; }
    .log-warn .log-level { color: #f0c674; }
    .log-error .log-level { color: #ff6b6b; }
    #log-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    #log-controls button { padding: 6px 14px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
    #logClearBtn { background: #f1f3f4; color: #444; }
    #logScrollBtn { background: #e8f0fe; color: #1a73e8; }
    #logStatus { font-size: 12px; color: #888; }
  </style>
</head>
<body>
<header>
  <h1>Crawler Admin</h1>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">
    <button id="startBtn" onclick="startCrawler()">▶ Start Crawler</button>
    <button id="stopBtn" onclick="stopCrawler()" disabled>■ Stop</button>
    <span id="crawlerStatus">⚫ Stopped</span>
    <span id="crawlerStats"></span>
    <button id="cleanupBtn" onclick="runCleanup()" style="margin-left:16px">Cleanup Old Data</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('dealers')">Dealers</div>
  <div class="tab" onclick="switchTab('total')">Total Leads</div>
  <div class="tab" onclick="switchTab('matched')">Matched Leads</div>
  <div class="tab" onclick="switchTab('unmatched')">Unmatched Leads</div>
  <div class="tab" onclick="switchTab('payments')">Payments</div>
  <div class="tab" onclick="switchTab('fetched')">Fetched Posts</div>
  <div class="tab" onclick="switchTab('logs')">Logs</div>
</div>

<div id="panel-dealers" class="panel active"></div>
<div id="panel-total" class="panel"></div>
<div id="panel-matched" class="panel"></div>
<div id="panel-unmatched" class="panel"></div>
<div id="panel-payments" class="panel"></div>
<div id="panel-fetched" class="panel"></div>
<div id="panel-logs" class="panel"></div>

<script>
let allDealers = [];
let allLeadsRaw = [];
let matchedRaw = [];
let unmatchedRaw = [];

const TAB_NAMES = ['dealers','total','matched','unmatched','payments','fetched','logs'];

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', TAB_NAMES[i] === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'dealers') loadDealers();
  else if (name === 'total') loadAllLeads();
  else if (name === 'matched') loadMatched();
  else if (name === 'unmatched') loadUnmatched();
  else if (name === 'payments') loadPayments();
  else if (name === 'fetched') loadFetchedPosts();
  else if (name === 'logs') initLogs();
}

// ── helpers ──────────────────────────────────────────────────────────────────

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function safeUrl(url) {
  const s = String(url || '');
  return /^https?:\/\//i.test(s) ? esc(s) : '#';
}
function fmtSource(subreddit) {
  if (subreddit === 'instagram') return '<span class="source-ig">📷 Instagram</span>';
  if (subreddit === 'indiamart') return '<span class="source-im">🏪 IndiaMART</span>';
  return `<span class="source-reddit">r/${esc(subreddit)}</span>`;
}
function fmtStatus(status) {
  const map = { matched: 'badge-matched', assigned: 'badge-assigned', unmatched: 'badge-unmatched' };
  return `<span class="badge ${map[status]||''}">${esc(status)}</span>`;
}
function filterByDate(rows, fromId, toId, dateField = 'emailed_at') {
  const from = document.getElementById(fromId)?.value;
  const to = document.getElementById(toId)?.value;
  return rows.filter(r => {
    const d = (r[dateField] || '').slice(0, 10);
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  });
}

// ── Dealers ───────────────────────────────────────────────────────────────────

async function loadDealers() {
  allDealers = await fetch('/api/dealers').then(r => r.json());
  const panel = document.getElementById('panel-dealers');
  panel.innerHTML = `
    <div class="filter-bar">
      <input type="search" id="dealer-search" placeholder="Search by name or email…" oninput="renderDealers()">
    </div>
    <div id="dealer-table"></div>`;
  renderDealers();
}

function renderDealers() {
  const q = (document.getElementById('dealer-search')?.value || '').toLowerCase();
  const rows = allDealers.filter(d =>
    !q || d.name.toLowerCase().includes(q) || (d.emails||'').toLowerCase().includes(q)
  );
  const el = document.getElementById('dealer-table');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<p>No dealers found.</p>'; return; }
  el.innerHTML = `<table>
    <thead><tr>
      <th>Name</th><th>State</th><th>City</th><th>Category</th>
      <th>Leads Used</th><th>Subscription</th><th>Expires</th><th>Action</th>
    </tr></thead>
    <tbody>${rows.map(d => `<tr>
      <td><strong>${esc(d.name)}</strong><br><small>${esc(d.emails)}</small></td>
      <td>${esc(d.state||'')}</td>
      <td>${esc(d.city||'')}</td>
      <td>${esc(d.industry_category||d.industry||'')}</td>
      <td>${d.subscription_status==='active' ? d.lead_count+'/∞' : d.lead_count+'/2'}</td>
      <td><span class="badge badge-${d.subscription_status==='active'?'active':'free'}">${d.subscription_status==='active'?'Active':'Free'}</span></td>
      <td>${d.subscription_expires_at ? d.subscription_expires_at.slice(0,10) : '—'}</td>
      <td>
        <button class="action btn-edit" onclick="openEditModal(${d.id})">Edit</button>
        <button class="action ${d.active?'btn-toggle-on':'btn-toggle-off'}" onclick="toggleDealer(${d.id},${d.active?0:1})">${d.active?'Disable':'Enable'}</button>
        ${d.subscription_status==='active'
          ? `<button class="action btn-sub-stop" onclick="dealerResetSub(${d.id})">Stop Sub</button>`
          : `<button class="action btn-sub-start" onclick="dealerActivateSub(${d.id})">Activate Sub</button>`
        }
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Total Leads ───────────────────────────────────────────────────────────────

async function loadAllLeads() {
  allLeadsRaw = await fetch('/api/leads/all').then(r => r.json());
  const panel = document.getElementById('panel-total');
  panel.innerHTML = `
    <div class="filter-bar">
      <input type="search" id="total-search" placeholder="Search post, source, category…" oninput="renderAllLeads()">
      <label>From <input type="date" id="total-from" onchange="renderAllLeads()"></label>
      <label>To <input type="date" id="total-to" onchange="renderAllLeads()"></label>
      <button class="btn-clear" onclick="clearFilter('total')">Clear</button>
    </div>
    <div id="total-table"></div>`;
  renderAllLeads();
}

function renderAllLeads() {
  const q = (document.getElementById('total-search')?.value || '').toLowerCase();
  let rows = filterByDate(allLeadsRaw, 'total-from', 'total-to');
  if (q) rows = rows.filter(r =>
    (r.post_title||'').toLowerCase().includes(q) ||
    (r.subreddit||'').toLowerCase().includes(q) ||
    (r.lead_category||'').toLowerCase().includes(q) ||
    (r.what_to_sell||'').toLowerCase().includes(q) ||
    (r.dealer_name||'').toLowerCase().includes(q)
  );
  const el = document.getElementById('total-table');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<p>No leads found.</p>'; return; }
  el.innerHTML = `<p class="count-badge">${rows.length} lead${rows.length!==1?'s':''}</p>
  <table>
    <thead><tr><th>Post</th><th>Source</th><th>Category</th><th>What to Sell</th><th>Status</th><th>Dealer</th><th>Date</th></tr></thead>
    <tbody>${rows.map(l => `<tr>
      <td style="max-width:260px"><a href="${safeUrl(l.post_url)}" target="_blank">${esc(l.post_title||'(no title)').slice(0,70)}</a></td>
      <td>${fmtSource(l.subreddit)}</td>
      <td>${esc(l.lead_category||'—')}</td>
      <td>${esc(l.what_to_sell||'—')}</td>
      <td>${fmtStatus(l.status)}</td>
      <td>${esc(l.dealer_name||'—')}</td>
      <td style="white-space:nowrap">${(l.emailed_at||'').slice(0,10)||'—'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Matched Leads ─────────────────────────────────────────────────────────────

async function loadMatched() {
  matchedRaw = await fetch('/api/leads').then(r => r.json());
  const panel = document.getElementById('panel-matched');
  panel.innerHTML = `
    <div class="filter-bar">
      <input type="search" id="matched-search" placeholder="Search post, dealer, category…" oninput="renderMatched()">
      <label>From <input type="date" id="matched-from" onchange="renderMatched()"></label>
      <label>To <input type="date" id="matched-to" onchange="renderMatched()"></label>
      <button class="btn-clear" onclick="clearFilter('matched')">Clear</button>
    </div>
    <div id="matched-table"></div>`;
  renderMatched();
}

function renderMatched() {
  const q = (document.getElementById('matched-search')?.value || '').toLowerCase();
  let rows = filterByDate(matchedRaw, 'matched-from', 'matched-to');
  if (q) rows = rows.filter(r =>
    (r.post_title||'').toLowerCase().includes(q) ||
    (r.dealer_name||'').toLowerCase().includes(q) ||
    (r.lead_category||'').toLowerCase().includes(q) ||
    (r.subreddit||'').toLowerCase().includes(q)
  );
  const el = document.getElementById('matched-table');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<p>No matched leads found.</p>'; return; }
  el.innerHTML = `<p class="count-badge">${rows.length} lead${rows.length!==1?'s':''}</p>
  <table>
    <thead><tr><th>Post</th><th>Source</th><th>Location</th><th>What to Sell</th><th>Dealer</th><th>Suggested Reply</th><th>Date</th></tr></thead>
    <tbody>${rows.map(l => `<tr>
      <td style="max-width:220px"><a href="${safeUrl(l.post_url)}" target="_blank">${esc(l.post_title||'(no title)').slice(0,60)}</a></td>
      <td>${fmtSource(l.subreddit)}</td>
      <td>${esc(l.post_location||'—')}</td>
      <td>${esc(l.what_to_sell||'—')}</td>
      <td>${esc(l.dealer_name||'—')}</td>
      <td class="reply-cell">${esc(l.suggested_reply||'—').slice(0,120)}</td>
      <td style="white-space:nowrap">${(l.emailed_at||'').slice(0,10)||'—'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Unmatched Leads ───────────────────────────────────────────────────────────

async function loadUnmatched() {
  unmatchedRaw = await fetch('/api/leads/unmatched').then(r => r.json());
  if (!allDealers.length) allDealers = await fetch('/api/dealers').then(r => r.json());
  const panel = document.getElementById('panel-unmatched');
  panel.innerHTML = `
    <div class="filter-bar">
      <input type="search" id="unmatched-search" placeholder="Search post, source, category…" oninput="renderUnmatched()">
      <label>From <input type="date" id="unmatched-from" onchange="renderUnmatched()"></label>
      <label>To <input type="date" id="unmatched-to" onchange="renderUnmatched()"></label>
      <button class="btn-clear" onclick="clearFilter('unmatched')">Clear</button>
    </div>
    <div id="unmatched-table"></div>`;
  renderUnmatched();
}

function renderUnmatched() {
  const q = (document.getElementById('unmatched-search')?.value || '').toLowerCase();
  let rows = filterByDate(unmatchedRaw, 'unmatched-from', 'unmatched-to');
  if (q) rows = rows.filter(r =>
    (r.post_title||'').toLowerCase().includes(q) ||
    (r.subreddit||'').toLowerCase().includes(q) ||
    (r.what_to_sell||'').toLowerCase().includes(q)
  );
  const el = document.getElementById('unmatched-table');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<p>No unmatched leads found.</p>'; return; }
  const dealerItems = allDealers.map(d => {
    const loc = [d.city, d.state].filter(Boolean).join(', ');
    return `<label class="ms-item"><input type="checkbox" value="${d.id}" name="assign-LEADID" onchange="updateMsLabel(LEADID)"> ${esc(d.name)}${loc ? `<span class="ms-loc">${esc(loc)}</span>` : ''}</label>`;
  }).join('');
  el.innerHTML = `<p class="count-badge">${rows.length} lead${rows.length!==1?'s':''}</p>
  <table>
    <thead><tr><th>Post</th><th>Source</th><th>Location</th><th>What to Sell</th><th>Suggested Reply</th><th>Date</th><th>Assign &amp; Send</th></tr></thead>
    <tbody>${rows.map(l => `<tr>
      <td style="max-width:220px"><a href="${safeUrl(l.post_url)}" target="_blank">${esc(l.post_title||'(no title)').slice(0,60)}</a></td>
      <td>${fmtSource(l.subreddit)}</td>
      <td>${esc(l.post_location||'—')}</td>
      <td>${esc(l.what_to_sell||'—')}</td>
      <td class="reply-cell">${esc(l.suggested_reply||'—').slice(0,120)}</td>
      <td style="white-space:nowrap">${(l.emailed_at||'').slice(0,10)||'—'}</td>
      <td>
        <div class="ms-wrap">
          <div class="ms-trigger" id="ms-trigger-${l.id}" onclick="toggleMs(${l.id})">
            <span id="ms-label-${l.id}">Select dealers…</span><span class="ms-arrow">▾</span>
          </div>
          <div class="ms-drop" id="ms-drop-${l.id}">
            <input class="ms-search" type="text" placeholder="Search dealers…" oninput="filterMs(${l.id},this.value)">
            <div class="ms-list" id="ms-list-${l.id}">${dealerItems.replace(/LEADID/g, l.id)}</div>
          </div>
        </div>
        <button class="action btn-send" style="margin-top:4px" onclick="assignLead(${l.id})">Send</button>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Payments ──────────────────────────────────────────────────────────────────

async function loadPayments() {
  const payments = await fetch('/api/payments').then(r => r.json());
  const panel = document.getElementById('panel-payments');
  if (!payments.length) { panel.innerHTML = '<p>No payment submissions yet.</p>'; return; }
  panel.innerHTML = `<table>
    <thead><tr><th>Dealer</th><th>UTR Number</th><th>Amount</th><th>Status</th><th>Submitted</th><th>Actions</th></tr></thead>
    <tbody>${payments.map(p => `<tr>
      <td>${esc(p.dealer_name)}</td>
      <td><code>${esc(p.utr_number)}</code></td>
      <td>&#8377;${p.amount}</td>
      <td><span class="badge badge-${p.status}">${p.status}</span></td>
      <td>${(p.created_at||'').slice(0,10)}</td>
      <td>${p.status==='pending' ? `
        <button class="action btn-verify" onclick="verifyPayment(${p.id})">Verify</button>
        <button class="action btn-reject" onclick="rejectPayment(${p.id})">Reject</button>
      ` : '—'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Fetched Posts ─────────────────────────────────────────────────────────────

async function loadFetchedPosts() {
  const posts = await fetch('/api/fetched-posts').then(r => r.json());
  const panel = document.getElementById('panel-fetched');
  if (!posts.length) { panel.innerHTML = '<p>No fetched posts yet. Click Run Crawl first.</p>'; return; }
  if (!allDealers.length) allDealers = await fetch('/api/dealers').then(r => r.json());
  const dealerOpts = allDealers.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  panel.innerHTML = `<table>
    <thead><tr>
      <th>Post</th><th>Source</th><th>Preview</th><th>Fetched</th><th>Send to Dealer</th>
    </tr></thead>
    <tbody>${posts.map(p => `<tr>
      <td style="max-width:220px"><a href="${safeUrl(p.post_url)}" target="_blank">${esc(p.post_title||'(no title)').slice(0,70)}</a></td>
      <td>${fmtSource(p.subreddit)}</td>
      <td style="max-width:200px;font-size:12px;color:#555">${esc(p.post_text||'').slice(0,100)}${p.post_text&&p.post_text.length>100?'…':''}</td>
      <td style="white-space:nowrap">${(p.fetched_at||'').slice(0,16).replace('T',' ')}</td>
      <td style="white-space:nowrap">
        <select class="assign" id="fp-dealer-${p.id}">
          <option value="">— Dealer —</option>${dealerOpts}
        </select>
        <button class="action btn-send" id="fp-btn-${p.id}" onclick="sendFetchedPost(${p.id})">Send</button>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────

function clearFilter(prefix) {
  const s = document.getElementById(prefix + '-search');
  const f = document.getElementById(prefix + '-from');
  const t = document.getElementById(prefix + '-to');
  if (s) s.value = '';
  if (f) f.value = '';
  if (t) t.value = '';
  if (prefix === 'total') renderAllLeads();
  else if (prefix === 'matched') renderMatched();
  else if (prefix === 'unmatched') renderUnmatched();
  else if (prefix === 'dealer') renderDealers();
}

async function sendFetchedPost(postId) {
  const dealerId = document.getElementById('fp-dealer-' + postId).value;
  if (!dealerId) { alert('Please select a dealer first'); return; }
  const btn = document.getElementById('fp-btn-' + postId);
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch(`/api/fetched-posts/${postId}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dealer_id: dealerId }),
    });
    const json = await res.json();
    if (json.success) {
      btn.textContent = 'Sent ✓';
      btn.style.background = '#e6f4ea';
      btn.style.color = '#1e7e34';
    } else {
      btn.disabled = false;
      btn.textContent = 'Send';
      alert('Error: ' + (json.error || 'Unknown error'));
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Send';
    alert('Network error');
  }
}

async function toggleDealer(id, active) {
  await fetch(`/api/dealers/${id}/toggle`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ active }) });
  loadDealers();
}

async function dealerActivateSub(id) {
  if (!confirm('Activate subscription for this dealer? This sets 30-day active period and resets lead count to 0.')) return;
  await fetch(`/api/dealers/${id}/activate-subscription`, { method: 'POST' });
  loadDealers();
}

async function dealerResetSub(id) {
  if (!confirm('Stop subscription for this dealer? This resets them to free tier.')) return;
  await fetch(`/api/dealers/${id}/reset-subscription`, { method: 'POST' });
  loadDealers();
}

async function verifyPayment(payId) {
  await fetch(`/api/payments/${payId}/verify`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
  loadPayments();
  loadDealers();
}

async function rejectPayment(payId) {
  await fetch(`/api/payments/${payId}/reject`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
  loadPayments();
}

function toggleMs(leadId) {
  const trigger = document.getElementById('ms-trigger-' + leadId);
  const drop = document.getElementById('ms-drop-' + leadId);
  const isOpen = drop.classList.contains('open');
  // close all open dropdowns first
  document.querySelectorAll('.ms-drop.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.ms-trigger.open').forEach(t => t.classList.remove('open'));
  if (!isOpen) {
    drop.classList.add('open');
    trigger.classList.add('open');
    drop.querySelector('.ms-search').focus();
  }
}

function filterMs(leadId, query) {
  const q = query.toLowerCase();
  document.querySelectorAll(`#ms-list-${leadId} .ms-item`).forEach(item => {
    item.style.display = item.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function updateMsLabel(leadId) {
  const checked = document.querySelectorAll(`#ms-list-${leadId} input:checked`);
  const label = document.getElementById('ms-label-' + leadId);
  label.textContent = checked.length ? `${checked.length} dealer${checked.length > 1 ? 's' : ''} selected` : 'Select dealers…';
}

// close dropdown when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('.ms-wrap')) {
    document.querySelectorAll('.ms-drop.open').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.ms-trigger.open').forEach(t => t.classList.remove('open'));
  }
});

async function assignLead(leadId) {
  const checked = [...document.querySelectorAll(`#ms-list-${leadId} input:checked`)];
  if (!checked.length) { alert('Please select at least one dealer'); return; }
  const dealer_ids = checked.map(c => parseInt(c.value));
  const res = await fetch(`/api/leads/${leadId}/assign-many`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dealer_ids }),
  });
  const data = await res.json();
  if (data.errors?.length) alert('Sent with some errors:\n' + data.errors.join('\n'));
  loadUnmatched();
}

async function runCleanup() {
  if (!confirm('Delete seen_posts older than 30 days, fetched_posts older than 60 days, and unmatched leads older than 90 days?')) return;
  const btn = document.getElementById('cleanupBtn');
  btn.disabled = true;
  btn.textContent = 'Cleaning…';
  try {
    const data = await fetch('/api/admin/cleanup', { method: 'POST' }).then(r => r.json());
    if (!data.error) {
      alert(`Cleanup done — seen_posts: -${data.deleted_seen}, fetched_posts: -${data.deleted_fetched}, unmatched leads: -${data.deleted_unmatched}`);
    } else {
      alert('Cleanup error: ' + data.error);
    }
  } catch (e) {
    alert('Cleanup failed');
  }
  btn.disabled = false;
  btn.textContent = 'Cleanup Old Data';
}

async function startCrawler() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  await fetch('/api/crawl/start', { method: 'POST' });
  pollStatus();
}

async function stopCrawler() {
  document.getElementById('stopBtn').disabled = true;
  await fetch('/api/crawl/stop', { method: 'POST' });
}

let statusPollTimer = null;
async function pollStatus() {
  clearTimeout(statusPollTimer);
  try {
    const res = await fetch('/api/crawl/status');
    const s = await res.json();
    const dot = s.running ? '🟢' : '⚫';
    document.getElementById('crawlerStatus').textContent = `${dot} ${s.running ? 'Running' : 'Stopped'}`;
    document.getElementById('crawlerStats').textContent = s.running
      ? `Posts: ${s.postsCollected} | Leads: ${s.leadsFound} | Emails: ${s.emailsSent} | ${s.currentSource || '—'}`
      : (s.lastBatchAt ? `Last run: Posts ${s.postsCollected} | Leads ${s.leadsFound} | Emails ${s.emailsSent}` : '');
    document.getElementById('startBtn').disabled = s.running;
    document.getElementById('stopBtn').disabled = !s.running;
    if (s.running) statusPollTimer = setTimeout(pollStatus, 5000);
  } catch (e) {
    statusPollTimer = setTimeout(pollStatus, 10000);
  }
}

pollStatus();

loadDealers();

// ── Live Logs ─────────────────────────────────────────────────────────────────

let logEs = null;
let logAutoScroll = true;

function initLogs() {
  const panel = document.getElementById('panel-logs');
  if (document.getElementById('log-box')) return; // already initialised
  panel.innerHTML = `
    <div id="log-controls">
      <span id="logStatus">⚪ Connecting…</span>
      <button id="logScrollBtn" onclick="toggleAutoScroll()">Auto-scroll: ON</button>
      <button id="logClearBtn" onclick="clearLogs()">Clear</button>
    </div>
    <div id="log-box"></div>`;
  loadExistingLogs();
  connectLogStream();
}

async function loadExistingLogs() {
  try {
    const logs = await fetch('/api/logs').then(r => r.json());
    logs.forEach(appendLogLine);
    scrollLogsToBottom();
  } catch(e) {}
}

function connectLogStream() {
  if (logEs) logEs.close();
  logEs = new EventSource('/api/logs/stream');
  logEs.onopen = () => { const el = document.getElementById('logStatus'); if (el) el.textContent = '🟢 Live'; };
  logEs.onmessage = e => {
    try { appendLogLine(JSON.parse(e.data)); } catch(_) {}
  };
  logEs.onerror = () => { const el = document.getElementById('logStatus'); if (el) el.textContent = '🔴 Disconnected — retrying…'; };
}

function appendLogLine(entry) {
  const box = document.getElementById('log-box');
  if (!box) return;
  const div = document.createElement('div');
  div.className = `log-line log-${entry.level}`;
  const t = entry.t ? entry.t.slice(11,19) : '';
  div.innerHTML = `<span class="log-time">${esc(t)}</span><span class="log-level">${entry.level.toUpperCase().slice(0,3)}</span><span class="log-msg">${esc(entry.msg)}</span>`;
  box.appendChild(div);
  // keep max 500 visible lines
  while (box.children.length > 500) box.removeChild(box.firstChild);
  if (logAutoScroll) scrollLogsToBottom();
}

function scrollLogsToBottom() {
  const box = document.getElementById('log-box');
  if (box) box.scrollTop = box.scrollHeight;
}

function toggleAutoScroll() {
  logAutoScroll = !logAutoScroll;
  const btn = document.getElementById('logScrollBtn');
  if (btn) btn.textContent = `Auto-scroll: ${logAutoScroll ? 'ON' : 'OFF'}`;
  if (logAutoScroll) scrollLogsToBottom();
}

function clearLogs() {
  const box = document.getElementById('log-box');
  if (box) box.innerHTML = '';
}

// ── Edit Dealer Modal ─────────────────────────────────────────────────────────

let editingDealerId = null;

function openEditModal(id) {
  const d = allDealers.find(x => x.id === id);
  if (!d) return;
  editingDealerId = id;
  document.getElementById('edit-name').value = d.name || '';
  document.getElementById('edit-emails').value = d.emails || '';
  document.getElementById('edit-industry_category').value = d.industry_category || d.industry || '';
  document.getElementById('edit-services').value = d.services || '';
  document.getElementById('edit-target_customers').value = d.target_customers || '';
  document.getElementById('edit-keywords').value = d.keywords || '';
  document.getElementById('edit-state').value = d.state || '';
  document.getElementById('edit-city').value = d.city || '';
  document.getElementById('edit-service_areas').value = d.service_areas || '';
  document.getElementById('edit-custom_subreddits').value = d.custom_subreddits || '';
  document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editingDealerId = null;
}

async function saveDealer() {
  if (!editingDealerId) return;
  const body = {
    name: document.getElementById('edit-name').value.trim(),
    emails: document.getElementById('edit-emails').value.trim(),
    industry_category: document.getElementById('edit-industry_category').value.trim(),
    services: document.getElementById('edit-services').value.trim(),
    target_customers: document.getElementById('edit-target_customers').value.trim(),
    keywords: document.getElementById('edit-keywords').value.trim(),
    state: document.getElementById('edit-state').value.trim(),
    city: document.getElementById('edit-city').value.trim(),
    service_areas: document.getElementById('edit-service_areas').value.trim(),
    custom_subreddits: document.getElementById('edit-custom_subreddits').value.trim(),
  };
  if (!body.name || !body.emails || !body.industry_category) {
    alert('Name, emails, and category are required.');
    return;
  }
  const btn = document.getElementById('editSaveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch(`/api/dealers/${editingDealerId}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.success) { closeEditModal(); loadDealers(); }
    else alert('Error: ' + data.error);
  } catch (e) {
    alert('Failed to save. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}
</script>
