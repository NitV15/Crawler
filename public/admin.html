<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Crawler</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #1a73e8; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 20px; }
    #crawlBtn { padding: 8px 20px; background: #fff; color: #1a73e8; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
    #crawlBtn:disabled { background: #ccc; color: #666; cursor: not-allowed; }
    #crawlResult { font-size: 13px; margin-left: 12px; color: #e8f0fe; }
    .tabs { display: flex; background: #fff; border-bottom: 2px solid #ddd; padding: 0 24px; }
    .tab { padding: 12px 20px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: bold; color: #555; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
    .panel { display: none; padding: 24px; }
    .panel.active { display: block; }
    table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-size: 13px; color: #555; border-bottom: 1px solid #ddd; }
    td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-free { background: #fce8e6; color: #c62828; }
    .badge-active { background: #e6f4ea; color: #1e7e34; }
    .badge-pending { background: #fff3e0; color: #e65100; }
    .badge-verified { background: #e6f4ea; color: #1e7e34; }
    .badge-rejected { background: #fce8e6; color: #c62828; }
    button.action { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 4px; }
    .btn-verify { background: #e6f4ea; color: #1e7e34; }
    .btn-reject { background: #fce8e6; color: #c62828; }
    .btn-toggle-on { background: #fce8e6; color: #c62828; }
    .btn-toggle-off { background: #e6f4ea; color: #1e7e34; }
    .btn-send { background: #e8f0fe; color: #1a73e8; }
    select.assign { padding: 4px 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .reply-cell { max-width: 200px; font-size: 12px; color: #555; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
<header>
  <h1>Crawler Admin</h1>
  <div style="display:flex;align-items:center">
    <button id="crawlBtn" onclick="triggerCrawl()">Run Crawl</button>
    <span id="crawlResult"></span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('dealers')">Dealers</div>
  <div class="tab" onclick="switchTab('matched')">Matched Leads</div>
  <div class="tab" onclick="switchTab('unmatched')">Unmatched Leads</div>
  <div class="tab" onclick="switchTab('payments')">Payments</div>
  <div class="tab" onclick="switchTab('fetched')">Fetched Posts</div>
</div>

<div id="panel-dealers" class="panel active"><p>Loading...</p></div>
<div id="panel-matched" class="panel"></div>
<div id="panel-unmatched" class="panel"></div>
<div id="panel-payments" class="panel"></div>
<div id="panel-fetched" class="panel"></div>

<script>
let allDealers = [];

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['dealers','matched','unmatched','payments','fetched'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'dealers') loadDealers();
  else if (name === 'matched') loadMatched();
  else if (name === 'unmatched') loadUnmatched();
  else if (name === 'payments') loadPayments();
  else if (name === 'fetched') loadFetchedPosts();
}

async function triggerCrawl() {
  const btn = document.getElementById('crawlBtn');
  const res = document.getElementById('crawlResult');
  btn.disabled = true;
  btn.textContent = 'Running...';
  res.textContent = '';
  try {
    const data = await fetch('/api/crawl/trigger', { method: 'POST' }).then(r => r.json());
    if (data.error) {
      res.textContent = 'Error: ' + data.error;
    } else {
      res.textContent = `Done — ${data.fetched} fetched · ${data.filtered} filtered · ${data.leads} leads · ${data.emails} emails · ${data.unmatched} unmatched`;
    }
  } catch (e) {
    res.textContent = 'Request failed';
  }
  btn.disabled = false;
  btn.textContent = 'Run Crawl';
  loadDealers();
}

async function loadDealers() {
  allDealers = await fetch('/api/dealers').then(r => r.json());
  const panel = document.getElementById('panel-dealers');
  if (!allDealers.length) { panel.innerHTML = '<p>No dealers registered yet.</p>'; return; }
  panel.innerHTML = `<table>
    <thead><tr>
      <th>Name</th><th>State</th><th>City</th><th>Category</th>
      <th>Leads Used</th><th>Subscription</th><th>Expires</th><th>Action</th>
    </tr></thead>
    <tbody>${allDealers.map(d => `<tr>
      <td><strong>${esc(d.name)}</strong><br><small>${esc(d.emails)}</small></td>
      <td>${esc(d.state||'')}</td>
      <td>${esc(d.city||'')}</td>
      <td>${esc(d.industry_category||d.industry||'')}</td>
      <td>${d.subscription_status==='active' ? d.lead_count+'/∞' : d.lead_count+'/2'}</td>
      <td><span class="badge badge-${d.subscription_status==='active'?'active':'free'}">${d.subscription_status==='active'?'Active':'Free'}</span></td>
      <td>${d.subscription_expires_at ? d.subscription_expires_at.slice(0,10) : '—'}</td>
      <td><button class="action ${d.active?'btn-toggle-on':'btn-toggle-off'}" onclick="toggleDealer(${d.id},${d.active?0:1})">${d.active?'Disable':'Enable'}</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadMatched() {
  const leads = await fetch('/api/leads').then(r => r.json());
  const panel = document.getElementById('panel-matched');
  if (!leads.length) { panel.innerHTML = '<p>No matched leads yet.</p>'; return; }
  panel.innerHTML = `<table>
    <thead><tr><th>Post</th><th>Subreddit</th><th>Location</th><th>What to Sell</th><th>Dealer</th><th>Suggested Reply</th><th>Date</th></tr></thead>
    <tbody>${leads.map(l => `<tr>
      <td><a href="${safeUrl(l.post_url)}" target="_blank">${esc(l.post_title||'(no title)').slice(0,60)}</a></td>
      <td>r/${esc(l.subreddit)}</td>
      <td>${esc(l.post_location||'—')}</td>
      <td>${esc(l.what_to_sell||'—')}</td>
      <td>${esc(l.dealer_name||'—')}</td>
      <td class="reply-cell">${esc(l.suggested_reply||'—').slice(0,120)}</td>
      <td>${(l.emailed_at||'').slice(0,10)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadUnmatched() {
  const leads = await fetch('/api/leads/unmatched').then(r => r.json());
  const panel = document.getElementById('panel-unmatched');
  if (!leads.length) { panel.innerHTML = '<p>No unmatched leads.</p>'; return; }
  const dealerOpts = allDealers.length ? allDealers : await fetch('/api/dealers').then(r => r.json());
  panel.innerHTML = `<table>
    <thead><tr><th>Post</th><th>Subreddit</th><th>Location</th><th>What to Sell</th><th>Suggested Reply</th><th>Assign &amp; Send</th></tr></thead>
    <tbody>${leads.map(l => `<tr>
      <td><a href="${safeUrl(l.post_url)}" target="_blank">${esc(l.post_title||'(no title)').slice(0,60)}</a></td>
      <td>r/${esc(l.subreddit)}</td>
      <td>${esc(l.post_location||'—')}</td>
      <td>${esc(l.what_to_sell||'—')}</td>
      <td class="reply-cell">${esc(l.suggested_reply||'—').slice(0,120)}</td>
      <td>
        <select class="assign" id="assign-${l.id}">
          <option value="">— Dealer —</option>
          ${dealerOpts.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}
        </select>
        <button class="action btn-send" onclick="assignLead(${l.id})">Send</button>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadPayments() {
  const payments = await fetch('/api/payments').then(r => r.json());
  const panel = document.getElementById('panel-payments');
  if (!payments.length) { panel.innerHTML = '<p>No payment submissions yet.</p>'; return; }
  panel.innerHTML = `<table>
    <thead><tr><th>Dealer</th><th>UTR Number</th><th>Amount</th><th>Status</th><th>Submitted</th><th>Actions</th></tr></thead>
    <tbody>${payments.map(p => `<tr>
      <td>${esc(p.dealer_name)}</td>
      <td><code>${esc(p.utr_number)}</code></td>
      <td>&#8377;${p.amount}</td>
      <td><span class="badge badge-${p.status}">${p.status}</span></td>
      <td>${(p.created_at||'').slice(0,10)}</td>
      <td>${p.status==='pending' ? `
        <button class="action btn-verify" onclick="verifyPayment(${p.id})">Verify</button>
        <button class="action btn-reject" onclick="rejectPayment(${p.id})">Reject</button>
      ` : '—'}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadFetchedPosts() {
  const posts = await fetch('/api/fetched-posts').then(r => r.json());
  const panel = document.getElementById('panel-fetched');
  if (!posts.length) { panel.innerHTML = '<p>No fetched posts yet. Click Run Crawl first.</p>'; return; }
  const dealerOpts = allDealers.length ? allDealers : await fetch('/api/dealers').then(r => r.json());
  panel.innerHTML = `<table>
    <thead><tr>
      <th>Post</th><th>Subreddit</th><th>Preview</th><th>Fetched</th><th>Send to Dealer</th>
    </tr></thead>
    <tbody>${posts.map(p => `<tr>
      <td style="max-width:220px"><a href="${safeUrl(p.post_url)}" target="_blank">${esc(p.post_title||'(no title)').slice(0,70)}</a></td>
      <td>r/${esc(p.subreddit)}</td>
      <td style="max-width:200px;font-size:12px;color:#555">${esc(p.post_text||'').slice(0,100)}${p.post_text&&p.post_text.length>100?'…':''}</td>
      <td style="white-space:nowrap">${(p.fetched_at||'').slice(0,16).replace('T',' ')}</td>
      <td style="white-space:nowrap">
        <select class="assign" id="fp-dealer-${p.id}">
          <option value="">— Dealer —</option>
          ${dealerOpts.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}
        </select>
        <button class="action btn-send" id="fp-btn-${p.id}" onclick="sendFetchedPost(${p.id})">Send</button>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function sendFetchedPost(postId) {
  const dealerId = document.getElementById('fp-dealer-' + postId).value;
  if (!dealerId) { alert('Please select a dealer first'); return; }
  const btn = document.getElementById('fp-btn-' + postId);
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch(`/api/fetched-posts/${postId}/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dealer_id: dealerId }),
    });
    const json = await res.json();
    if (json.success) {
      btn.textContent = 'Sent ✓';
      btn.style.background = '#e6f4ea';
      btn.style.color = '#1e7e34';
    } else {
      btn.disabled = false;
      btn.textContent = 'Send';
      alert('Error: ' + (json.error || 'Unknown error'));
    }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Send';
    alert('Network error');
  }
}

async function toggleDealer(id, active) {
  await fetch(`/api/dealers/${id}/toggle`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ active }) });
  loadDealers();
}

async function verifyPayment(payId) {
  await fetch(`/api/payments/${payId}/verify`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
  loadPayments();
  loadDealers();
}

async function rejectPayment(payId) {
  await fetch(`/api/payments/${payId}/reject`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
  loadPayments();
}

async function assignLead(leadId) {
  const dealerId = document.getElementById('assign-' + leadId).value;
  if (!dealerId) { alert('Please select a dealer first'); return; }
  await fetch(`/api/leads/${leadId}/assign`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dealer_id: dealerId }) });
  loadUnmatched();
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function safeUrl(url) {
  const s = String(url || '');
  return /^https?:\/\//i.test(s) ? esc(s) : '#';
}

loadDealers();
</script>
</body>
</html>
